        hilo.textContent = "";
        if (!x.data.length) hilo.appendChild(e("p", "vacio", "Todavía no hay mensajes con este cliente."));
        x.data.forEach(function (m) { var b = e("div", "burbuja " + m.de); b.appendChild(e("p", "", m.cuerpo)); b.appendChild(e("small", "", (m.de === "cliente" ? "Cliente · " : "Tú · ") + fecha(m.creado_at))); hilo.appendChild(b); });
        if (abajo || !hilo.dataset.v) { hilo.scrollTop = hilo.scrollHeight; hilo.dataset.v = "1"; }
      });
    }
    function enviar() {
      var t = area.value.trim(); if (!t) { estado.textContent = "Escribe un mensaje primero."; return Promise.resolve(false); }
      estado.textContent = "Enviando…";
      return sb.rpc("rnm_admin_mensaje_enviar", { p_user: c.user_id, p_cuerpo: t }).then(function (x) {
        if (x.error) { estado.textContent = "No se pudo enviar. Intenta de nuevo."; return false; }
        area.value = ""; estado.textContent = "Enviado en la app."; return pintar().then(function () { return true; });
      });
    }
    var b1 = btn("Enviar en la app", enviar); bot.appendChild(b1);
    var wa1 = wa(c.telefono);
    if (wa1) {
      var a = e("a", "", "Enviar y abrir WhatsApp"); a.href = wa1; a.target = "_blank"; a.rel = "noopener";
      area.addEventListener("input", function () { a.href = wa1 + "?text=" + encodeURIComponent(textoWhatsApp(c, area.value.trim())); });
      a.addEventListener("click", function () { if (area.value.trim()) enviar(); });
      bot.appendChild(a);
    }
    if (c.rnm_no_encontrado > 0) {
      var pl = btn("Plantilla: RNM mal escrito", function () {
        area.value = "Hola " + c.nombre.split(" ")[0] + ", la Polícia Federal no encontró el RNM que registraste. Revisa tu carné: el número lleva letras, por ejemplo A123456B. Entra a la app, abre ese RNM y toca «Corregir RNM o fecha»; lo consultamos de nuevo gratis.";
        area.dispatchEvent(new Event("input")); area.focus();
      }, true); pl.className = "plantilla"; bot.appendChild(pl);
    }
    bot.appendChild(btn("Cerrar", cerrar, true));
    fondo.addEventListener("click", function (ev) { if (ev.target === fondo) cerrar(); });
    document.body.appendChild(fondo); document.body.style.overflow = "hidden";
    pintar(); timer = setInterval(function () { if (!document.hidden) pintar(); }, 10000);
  }

  function pintarClientes(cont) {
    cont.textContent = "";
    var q = sinAcento(estadoClientes.busca);
    var lista = clientesCargados.filter(function (c) {
      if (estadoClientes.filtro === "sin_leer" && !c.sin_leer) return false;
      if (estadoClientes.filtro === "no_enc" && !c.rnm_no_encontrado) return false;
      return !q || sinAcento(c.nombre + " " + c.email + " " + c.telefono + " " + c.ciudad).indexOf(q) >= 0;
    });
    if (!lista.length) { cont.appendChild(e("p", "vacio", "Nadie coincide con ese filtro.")); return; }
    lista.forEach(function (c) {
      var t = e("div", "persona"), cab = e("div", "cab"), tit = e("div");
      tit.appendChild(e("b", "", c.nombre)); tit.appendChild(e("br")); tit.appendChild(e("small", "", c.email || "")); cab.appendChild(tit);
      if (c.sin_leer) cab.appendChild(e("span", "sinleer", c.sin_leer + " sin leer")); else cab.appendChild(e("span", "insignia " + (c.plan_estado === "activo" ? "activo" : c.plan_estado === "cancelado" ? "cancelado" : c.plan_estado === "vencido" ? "vencido" : ""), c.plan_estado));
      t.appendChild(cab);
      var d = e("div", "datos");
      [["Teléfono", c.telefono ? "+" + soloDigitos(c.telefono) : "—"], ["Ciudad", c.ciudad ? c.ciudad + (c.uf ? " / " + c.uf : "") : "—"], ["RNM", num(c.n_rnm)], ["Se registró", new Date(c.creado_at).toLocaleDateString("es", { day: "2-digit", month: "short" })]].forEach(function (par) { var w = e("div"); w.appendChild(e("span", "", par[0])); w.appendChild(e("br")); w.appendChild(e("b", "", par[1])); d.appendChild(w); });
      t.appendChild(d);
      if (c.rnm_no_encontrado > 0) t.appendChild(e("p", "nota-p", "Tiene " + c.rnm_no_encontrado + " RNM que la PF no encontró: probablemente lo escribió mal."));
      var acc = e("div", "acc"); var m = e("button", "msg", c.ultimo_mensaje_at ? "Conversación" : "Escribir"); m.type = "button"; m.addEventListener("click", function () { abrirHilo(c); }); acc.appendChild(m);
      var link = wa(c.telefono); if (link) { var a = e("a", "", "WhatsApp"); a.href = link; a.target = "_blank"; a.rel = "noopener"; acc.appendChild(a); }
      t.appendChild(acc); cont.appendChild(t);
    });
  }

  function dibujarClientes() {
    seccion("Clientes y mensajes");
    var sin = clientesCargados.filter(function (c) { return c.sin_leer > 0; }).length;
    var noEnc = clientesCargados.filter(function (c) { return c.rnm_no_encontrado > 0; }).length;
    if (estadoClientes.filtro === "todos" && !estadoClientes.tocado) estadoClientes.filtro = sin ? "sin_leer" : (noEnc ? "no_enc" : "todos");
    var barra = e("div", "barra"), cont = e("div", "personas");
    var chips = [["sin_leer", "Sin leer (" + sin + ")"], ["no_enc", "RNM no encontrado (" + noEnc + ")"], ["todos", "Todos (" + clientesCargados.length + ")"]];
    var botones = chips.map(function (c) {
      var b = e("button", "chip" + (estadoClientes.filtro === c[0] ? " on" : ""), c[1]); b.type = "button";
      b.addEventListener("click", function () { estadoClientes.filtro = c[0]; estadoClientes.tocado = true; botones.forEach(function (x, i) { x.className = "chip" + (chips[i][0] === c[0] ? " on" : ""); }); pintarClientes(cont); });
      barra.appendChild(b); return b;
    });
    var bus = e("input"); bus.type = "search"; bus.placeholder = "Buscar cliente"; bus.value = estadoClientes.busca;
    bus.addEventListener("input", function () { estadoClientes.busca = bus.value; pintarClientes(cont); });
    barra.appendChild(bus); app.appendChild(barra); app.appendChild(cont); pintarClientes(cont);
  }

  function dibujar(d) {
    limpiar();
    var c = d.clientes, r = d.rnm, s = d.suscripciones, v = d.ventas, m = d.marketing, av = (d.avisos && d.avisos.por_estado) || {};
    var top = e("header", "top"); top.appendChild(e("h1", "", "Panel general"));
    top.appendChild(e("small", "", "Actualizado " + fecha(d.generado_at)));
    top.appendChild(btn("Actualizar", cargar, true)); top.appendChild(btn("Salir", function () { sb.auth.signOut().then(function () { location.reload(); }); }, true));
    app.appendChild(top);

    // Alertas
    var al = e("div", "alertas"); var hayAlerta = false;
    function alerta(t, cl) { hayAlerta = true; al.appendChild(e("div", "alerta" + (cl ? " " + cl : ""), t)); }
    var minBot = r.ultima_consulta ? (Date.now() - new Date(r.ultima_consulta).getTime()) / 60000 : Infinity;
    if (r.en_cola > 0 && minBot > 180) alerta("Hay " + r.en_cola + " RNM esperando consulta y el bot no consulta " + hace(r.ultima_consulta) + ". Revisa el servidor.", "mal");
    if ((av.error || 0) > 0) alerta(num(av.error) + " aviso(s) de WhatsApp con error o esperando número de un aliado.", "");
    if (s.vencen_7d > 0) alerta(num(s.vencen_7d) + " plan(es) vencen en los próximos 7 días.", "");
    if (r.sin_consultar > 0) alerta(num(r.sin_consultar) + " RNM todavía sin ninguna consulta.", "");
    if (m.ultimo_dato && (Date.now() - new Date(m.ultimo_dato).getTime()) / 86400000 > 3) alerta("Los datos de gasto de Meta están atrasados (último: " + m.ultimo_dato + ").", "");
    var sinLeerTot = clientesCargados.reduce(function (a, c) { return a + (c.sin_leer || 0); }, 0);
    var cSin = clientesCargados.filter(function (c) { return c.sin_leer > 0; }).length;
    if (cSin) alerta(cSin + " cliente(s) te escribieron (" + sinLeerTot + " mensajes) y esperan respuesta.", "mal");
    var cNoEnc = clientesCargados.filter(function (c) { return c.rnm_no_encontrado > 0; }).length;
    if (cNoEnc) alerta(cNoEnc + " cliente(s) tienen un RNM que la PF no encontró (probable error al escribirlo): avísales desde «Clientes y mensajes».", "");
    if (!hayAlerta) alerta("Todo en orden: sin alertas.", "ok");
    app.appendChild(al);

    // Resumen
    seccion("Resumen");
    var costoReg = c.ultimos_30d ? (Number(m.gasto_30d) / c.ultimos_30d) : null;
    rejilla([
      cifra("Clientes", num(c.total), "+" + num(c.hoy) + " hoy · +" + num(c.ultimos_7d) + " en 7 días"),
      cifra("Suscripciones activas", num(s.activas), num(s.semanal) + " semanal · " + num(s.manual) + " manual", s.activas ? "ok" : ""),
      cifra("Ingreso mensual recurrente", reales(s.mrr_centavos), "planes activos sin cancelar"),
      cifra("Vendido (30 días)", reales(v.bruto_30d_centavos), num(v.pagos) + " pagos en total"),
      cifra("Gasto en anuncios (30 días)", realesU(m.gasto_30d), "7 días: " + realesU(m.gasto_7d)),
      cifra("Costo por cliente nuevo", costoReg === null ? "—" : realesU(costoReg), "gasto 30 d ÷ clientes nuevos 30 d")
    ]);

    // Clientes
    seccion("Clientes");
    var dos = e("div", "dos"); app.appendChild(dos);
    var cj = e("div", "caja"); cj.appendChild(e("b", "", "Registros por día (últimos 30)"));
    barras(cj, c.serie_30d.map(function (x) { return x.n; }), c.serie_30d[0].d.slice(5), c.serie_30d[c.serie_30d.length - 1].d.slice(5)); dos.appendChild(cj);
    var emb = e("div", "caja"); emb.appendChild(e("b", "", "Embudo"));
    filas(emb, [
      ["Se registraron", c.total, "", num(c.total)],
      ["Completaron perfil", c.con_perfil, "", num(c.con_perfil) + " · " + pct(c.con_perfil, c.total)],
      ["Registraron un RNM", c.con_rnm, "", num(c.con_rnm) + " · " + pct(c.con_rnm, c.total)],
      ["Han pagado alguna vez", c.han_pagado, "var(--verde)", num(c.han_pagado) + " · " + pct(c.han_pagado, c.total)],
      ["Plan activo hoy", c.con_plan_activo, "var(--verde)", num(c.con_plan_activo) + " · " + pct(c.con_plan_activo, c.total)]
    ], c.total || 1);
    emb.appendChild(e("p", "vacio", num(c.con_avisos_whatsapp) + " aceptaron avisos por WhatsApp."));
    dos.appendChild(emb);

    dibujarClientes();

    // Suscripciones y compras
    seccion("Suscripciones y compras");
    rejilla([
      cifra("Activas", num(s.activas), "semanal " + num(s.semanal) + " · manual " + num(s.manual), s.activas ? "ok" : ""),
      cifra("Canceladas (aún activas)", num(s.canceladas_aun_activas), "no se renuevan", s.canceladas_aun_activas ? "aviso" : ""),
      cifra("Vencen en 7 días", num(s.vencen_7d), "", s.vencen_7d ? "aviso" : ""),
      cifra("Vencidas", num(s.vencidas), "dejaron de pagar"),
      cifra("Cobrado bruto", reales(v.bruto_centavos), "neto " + reales(v.neto_centavos)),
      cifra("Comisiones de Mercado Pago", reales(v.comision_centavos), "sobre pagos con neto conocido")
    ]);
    var dos2 = e("div", "dos"); dos2.style.marginTop = "10px"; app.appendChild(dos2);
    var cm = e("div", "caja"); cm.appendChild(e("b", "", "Ventas por mes"));
    barras(cm, v.por_mes.map(function (x) { return x.bruto; }), MES[Number(v.por_mes[0].mes.slice(5, 7)) - 1], MES[Number(v.por_mes[v.por_mes.length - 1].mes.slice(5, 7)) - 1]);
    cm.appendChild(e("p", "vacio", v.por_mes.map(function (x) { return MES[Number(x.mes.slice(5, 7)) - 1] + " " + reales(x.bruto); }).join(" · "))); dos2.appendChild(cm);
    var mt = e("div", "caja"); mt.appendChild(e("b", "", "Por método de pago"));
    var pm = Object.keys(v.por_metodo).map(function (k) { return [k, v.por_metodo[k].n, "", num(v.por_metodo[k].n) + " · " + reales(v.por_metodo[k].monto)]; });
    filas(mt, pm); dos2.appendChild(mt);
    dibujarPersonas();
    var ultimos = e("h2", "", "Últimos pagos"); app.appendChild(ultimos);
    tabla(["Fecha", "Cliente", "Método", "Plan", "Monto"], v.ultimos.map(function (p) { return [fecha(p.fecha), p.cliente || "—", p.metodo || "—", p.tipo || "—", reales(p.monto)]; }));

    // RNM y bot
    seccion("RNM y bot de consultas");
    rejilla([
      cifra("RNM registrados", num(r.total), num(r.abiertos) + " abiertos · " + num(r.cerrados) + " cerrados"),
      cifra("Consultas (24 h)", num(r.consultas_24h), "7 días: " + num(r.consultas_7d)),
      cifra("Última consulta", hace(r.ultima_consulta), r.ultima_consulta ? fecha(r.ultima_consulta) : "", (r.en_cola > 0 && minBot > 180) ? "mal" : "ok"),
      cifra("En cola ahora", num(r.en_cola), "esperando que el bot los consulte", r.en_cola ? "aviso" : "ok"),
      cifra("Sin consultar", num(r.sin_consultar), "", r.sin_consultar ? "aviso" : ""),
      cifra("Con validez leída", num(r.con_validez), pct(r.con_validez, r.total) + " de los RNM"),
      cifra("«Verificar ahora» (7 d)", num(r.verificaciones_manuales_7d), "plan manual")
    ]);
    var est = e("div", "caja"); est.style.marginTop = "10px"; est.appendChild(e("b", "", "RNM por estado"));
    filas(est, Object.keys(r.por_estado).map(function (k) { return [k, r.por_estado[k]]; }).sort(function (a, b) { return b[1] - a[1]; })); app.appendChild(est);

    // Aliados
    seccion("Aliados");
    tabla(["Aliado", "Clientes", "Con plan", "Neto generado", "Su parte", "Liquidado"], d.aliados.map(function (a) {
      var parte = Math.round(a.neto_centavos * a.porcentaje / 100);
      return [a.nombre + " (" + a.porcentaje + " %)", num(a.clientes), num(a.con_plan_activo), reales(a.neto_centavos), reales(parte), reales(a.liquidado_centavos)];
    }));

    // Avisos
    seccion("Avisos por WhatsApp");
    var ac = e("div", "caja"); filas(ac, Object.keys(av).map(function (k) { return [k, av[k], k === "error" ? "var(--rojo)" : (k === "enviado" ? "var(--verde)" : "")]; })); app.appendChild(ac);
    app.appendChild(e("p", "nota", "Datos en vivo de la base de la app. Los importes de ventas vienen de Mercado Pago (tarjeta, Pix y boleto); el gasto, de la sincronización de Meta. El ingreso mensual recurrente suma el precio de los planes activos que no se han cancelado."));
  }

  function cargar() {
    Promise.all([sb.rpc("rnm_admin_resumen"), sb.rpc("rnm_admin_planes"), sb.rpc("rnm_admin_clientes")]).then(function (rs) {
      var x = rs[0]; planesCargados = (rs[1] && rs[1].data) || []; clientesCargados = (rs[2] && rs[2].data) || [];
      if (x.error) {
        if (x.error.code === "42501" || /no_autorizado/.test(x.error.message || "")) return pantalla("Sin acceso", "Esta cuenta no tiene permiso para ver el panel.", [btn("Salir", function () { sb.auth.signOut().then(function () { location.reload(); }); })]);
        return pantalla("No se pudo cargar", "Revisa tu conexión e inténtalo de nuevo.", [btn("Reintentar", cargar)]);
      }
      dibujar(x.data);
    });
  }

  function iniciar() {
    sb.auth.getSession().then(function (s) {
      if (!s.data.session) {
        return pantalla("Panel general", "Solo para el dueño. Entra con tu cuenta de Google.", [btn("Entrar con Google", function () {
          sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } });
        })]);
      }
      cargar();
      if (temporizador) clearInterval(temporizador);
      temporizador = setInterval(function () { if (!document.hidden) cargar(); }, 120000);
    });
  }
  iniciar();
})();
</script>
</body>
</html>
