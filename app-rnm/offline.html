<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1F47">
<title>Sin conexión — ¿Dónde está mi RNM?</title>
<style>
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; text-align: center;
    background: radial-gradient(600px 360px at 85% -40px, rgba(46, 107, 240, .55), transparent 70%), linear-gradient(180deg, #071A3E, #0C2B66);
  }
  .caja { max-width: 340px; }
  img { width: 120px; height: auto; filter: drop-shadow(0 16px 28px rgba(0, 0, 0, .35)); }
  h1 { font-size: 1.5rem; margin: 22px 0 8px; letter-spacing: -0.02em; }
  p { margin: 0 0 24px; color: rgba(255, 255, 255, .78); line-height: 1.45; }
  button { min-height: 52px; padding: 0 28px; border: 0; border-radius: 16px; font-family: inherit; font-size: 1rem; font-weight: 700; color: #0A1F47; background: #fff; box-shadow: 0 10px 26px rgba(0, 0, 0, .25); }
  button:active { transform: scale(.97); }
</style>
</head>
<body>
  <div class="caja">
    <img src="logo-rnm-grande.png" alt="" width="210" height="193">
    <h1>Sin conexión</h1>
    <p>Necesitas internet para ver el estado de tu RNM. Revisa tu conexión y vuelve a intentarlo.</p>
    <button type="button" onclick="location.replace('./index.html')">Reintentar</button>
  </div>
  <script>window.addEventListener("online", function () { location.replace("./index.html"); });</script>
</body>
</html>
